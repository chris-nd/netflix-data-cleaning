[project]
name = "cleaning_netflix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chris Nd", email = "50488760+chris-nd@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "commitizen>=4.19.0",
]

[project.scripts]
cleaning_netflix-dataset = "cleaning_netflix_dataset:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
